appId: biz.cre8ive.hearth
productName: Hearth
directories:
  output: release
# Auto-update feed. One-time setup: create this GitHub repo, push the code,
# set `owner` to your GitHub username, then release with `npm run release`
# (needs GH_TOKEN). See docs/updates.md.
publish:
  provider: github
  owner: cre8ieguy
  repo: hearth
  releaseType: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - target: dir
  identity: null
npmRebuild: false
