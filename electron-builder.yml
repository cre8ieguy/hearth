appId: biz.cre8ive.hearth
productName: Hearth
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - target: dir
  identity: null
npmRebuild: false
